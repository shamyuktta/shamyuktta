<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- ASCII Animated Gradient -->
    <linearGradient id="asciiGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Scanline Sweep Gradient -->
    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Background Glows -->
    <radialGradient id="glowPurple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="60%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .text-primary { fill: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .text-muted { fill: #94A3B8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; }

    /* ASCII Line-by-Line Animations */
    .ascii-line { opacity: 0; animation: fadeInLine 0.5s forwards; }
    .al-1 { animation-delay: 0.1s; }
    .al-2 { animation-delay: 0.2s; }
    .al-3 { animation-delay: 0.3s; }
    .al-4 { animation-delay: 0.4s; }
    .al-5 { animation-delay: 0.5s; }
    .al-6 { animation-delay: 0.6s; }
    .al-7 { animation-delay: 0.7s; }
    .al-8 { animation-delay: 0.8s; }
    .al-9 { animation-delay: 0.9s; }
    .al-10 { animation-delay: 1.0s; }
    .al-11 { animation-delay: 1.1s; }
    .al-12 { animation-delay: 1.2s; }

    @keyframes fadeInLine {
      to { opacity: 1; }
    }

    /* Floating ASCII Container */
    .ascii-container {
      animation: floatASCII 4s ease-in-out infinite alternate;
    }
    @keyframes floatASCII {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* Typing Animation */
    .typing-text {
      font-weight: 600;
      fill: url(#accentGradDark);
    }

    /* Cursor Blink */
    .cursor {
      animation: blink 0.8s infinite;
      fill: #22D3EE;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Sequential Reveal */
    .seq-item {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.6s forwards;
    }
    .seq-1 { animation-delay: 0.4s; }
    .seq-2 { animation-delay: 0.6s; }
    .seq-3 { animation-delay: 0.8s; }
    .seq-4 { animation-delay: 1.0s; }
    .seq-5 { animation-delay: 1.2s; }
    .seq-6 { animation-delay: 1.4s; }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Floating Particles */
    .particle {
      animation: particleFloat 6s ease-in-out infinite alternate;
    }
    @keyframes particleFloat {
      0% { transform: translate(0, 0); opacity: 0.3; }
      100% { transform: translate(15px, -20px); opacity: 0.8; }
    }

    /* Skill Pill Hover & Glow */
    .skill-pill {
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .skill-pill:hover {
      transform: scale(1.08);
    }

    /* Border Shimmer */
    .shimmer-border {
      stroke-dasharray: 200 400;
      animation: shimmer 6s linear infinite;
    }
    @keyframes shimmer {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1180" height="610" rx="24" fill="url(#darkBg)" />

  <!-- Ambient Radial Glows -->
  <circle cx="200" cy="150" r="300" fill="url(#glowPurple)" />
  <circle cx="950" cy="100" r="280" fill="url(#glowCyan)" />
  <circle cx="700" cy="500" r="250" fill="url(#glowEmerald)" />

  <!-- Background Animated Particles -->
  <g class="particle" style="animation-duration: 7s;">
    <circle cx="120" cy="80" r="2" fill="#7C3AED" opacity="0.6" />
    <circle cx="450" cy="520" r="1.5" fill="#22D3EE" opacity="0.5" />
    <circle cx="1080" cy="480" r="2" fill="#10B981" opacity="0.6" />
    <circle cx="850" cy="70" r="2.5" fill="#7C3AED" opacity="0.4" />
  </g>
  <g class="particle" style="animation-duration: 10s; animation-delay: -3s;">
    <circle cx="250" cy="450" r="2" fill="#22D3EE" opacity="0.7" />
    <circle cx="600" cy="120" r="1.5" fill="#10B981" opacity="0.5" />
    <circle cx="1020" cy="220" r="2" fill="#7C3AED" opacity="0.6" />
  </g>

  <!-- Outer Shimmer Border -->
  <rect x="2" y="2" width="1176" height="606" rx="23" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <rect x="2" y="2" width="1176" height="606" rx="23" fill="none" stroke="url(#accentGradDark)" stroke-width="1.5" class="shimmer-border" opacity="0.7" />

  <!-- ================= LEFT PANEL: ASCII ART (38% Width) ================= -->
  <g filter="url(#cardShadow)">
    <rect x="35" y="35" width="420" height="540" rx="16" fill="#0F172A" fill-opacity="0.65" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  </g>

  <!-- Terminal Card Header -->
  <rect x="35" y="35" width="420" height="40" rx="16" fill="#1E293B" fill-opacity="0.5" />
  <circle cx="60" cy="55" r="5.5" fill="#EF4444" />
  <circle cx="78" cy="55" r="5.5" fill="#F59E0B" />
  <circle cx="96" cy="55" r="5.5" fill="#10B981" />
  <text x="245" y="60" text-anchor="middle" class="mono" fill="#64748B" font-size="11" letter-spacing="1">avatar.sys — 80x24</text>

  <!-- Floating ASCII Art Container -->
  <g class="ascii-container">
