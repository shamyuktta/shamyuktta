    <path d="M 55 110 L 435 110" stroke="url(#accentGradDark)" stroke-width="1" opacity="0.2" />
    <path d="M 55 490 L 435 490" stroke="url(#accentGradDark)" stroke-width="1" opacity="0.2" />

    <!-- Cyber ASCII Portrait -->
    <g class="mono" font-size="11" font-weight="bold" fill="url(#asciiGradDark)" filter="url(#glowFilter)">
